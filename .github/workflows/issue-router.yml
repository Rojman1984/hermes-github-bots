name: Issue Router

# The swarm's state machine (thepopebot Cluster Mode pattern, adapted):
#   - an issue labeled `task` is a work order for the fleet
#   - the issue body's first line after a `bot:` directive selects the bot
#     (default: `default` profile)
#   - the router dispatches the task through the production funnel, posts the
#     bot's result as an issue comment, and closes the issue
#   - `incident`-labeled issues are NOT routed — they belong to Sentinel's
#     health loop (auto-closed after 2h clean checks)
#
# Human workflow: open an issue describing a task, add the `task` label.
# The fleet picks it up; the whole lifecycle is auditable on the issue.
#
# Routing (model tiers): scout/scribe → /p/<bot>/ (LOCAL iGPU models);
# default/other → main gateway (cloud glm). Same policy as dispatch workflow.

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-router-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write

env:
  HERMES_URL: ${{ secrets.HERMES_API_URL }}
  HERMES_KEY: ${{ secrets.HERMES_API_KEY }}
  SCOUT_KEY: ${{ secrets.SCOUT_API_KEY }}
  SCRIBE_KEY: ${{ secrets.SCRIBE_API_KEY }}
  REPO: Rojman1984/hermes-github-bots

jobs:
  route:
    # only fire for the `task` label (not incident, not anything else)
    if: github.event.label.name == 'task' && github.event.action == 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract task + bot from issue
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NUM="${{ github.event.issue.number }}"
          BODY=$(gh issue view "$NUM" --repo "$REPO" --json body -q .body)
          # first line starting with "bot:" names the profile; default otherwise
          BOT=$(echo "$BODY" | grep -m1 -oE '^bot:[[:alnum:]_-]+' | cut -d: -f2 || true)
          [ -n "$BOT" ] || BOT=default
          # strip any leading directive lines to form the task text
          TASK=$(echo "$BODY" | sed '/^bot:/d' | sed '/^\s*$/d' | head -c 6000)
          echo "bot=$BOT" >> "$GITHUB_OUTPUT"
          {
            echo "task<<TASK_EOF"
            echo "$TASK"
            echo "TASK_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Routing issue #$NUM to bot '$BOT'"

      - name: Mark issue in-progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$REPO" \
            --body "🤖 Dispatched to bot \`${{ steps.parse.outputs.bot }}\` — working on it now.
          (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Dispatch to the fleet
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BOT="${{ steps.parse.outputs.bot }}"
          # model-tier routing (same policy as hermes-bot-dispatch)
          case "$BOT" in
            scout)  ROUTE="/p/scout";  BOTKEY="$SCOUT_KEY"  ;;
            scribe) ROUTE="/p/scribe"; BOTKEY="$SCRIBE_KEY" ;;
            *)      ROUTE="";          BOTKEY="$HERMES_KEY" ;;
          esac
          [ -n "$BOTKEY" ] || { echo "::error::No API key for bot '$BOT'"; exit 1; }
          echo "routing '$BOT' -> ${ROUTE:-/} (local-tier: $([ -n "$ROUTE" ] && echo yes || echo no))"

          HTTP_CODE=$(curl -s -m 900 -o /tmp/resp.json -w '%{http_code}' -X POST \
            "${HERMES_URL%/}${ROUTE}/v1/chat/completions" \
            -H "Authorization: Bearer ${BOTKEY}" \
            -H "X-Hermes-Session-Id: fleet-${BOT}${ROUTE:+-local}" \
            -H "Content-Type: application/json" \
            --max-time 890 \
            -d "$(jq -n --arg bot "$BOT" --arg task "${{ steps.parse.outputs.task }}" \
              '{model: ("hermes-" + $bot),
                messages: [{role: "user", content: $task}]}')") || HTTP_CODE=000
          [ "$HTTP_CODE" = "200" ] || {
            echo "::error::Fleet dispatch returned HTTP $HTTP_CODE"
            gh issue comment "${{ github.event.issue.number }}" --repo "$REPO" \
              --body "❌ Dispatch failed (HTTP $HTTP_CODE). Re-add the \`task\` label to retry."
            exit 1
          }
          jq -r '.choices[0].message.content' /tmp/resp.json > /tmp/router_reply.md
          echo "reply saved to /tmp/router_reply.md ($(wc -c < /tmp/router_reply.md) bytes)"

      - name: Deliver result + close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BOT="${{ steps.parse.outputs.bot }}"
          # body from file: scout replies contain shell-hostile characters, so
          # never interpolate the reply into the command line
          {
            echo "✅ **Bot \`$BOT\` completed this task:**"
            echo ""
            echo "<details><summary>Reply</summary>"
            echo ""
            cat /tmp/router_reply.md
            echo ""
            echo "</details>"
            echo ""
            echo "Closing as delivered. Reopen + re-label \`task\` if more work is needed."
          } > /tmp/comment_body.md
          gh issue comment "${{ github.event.issue.number }}" --repo "$REPO" --body-file /tmp/comment_body.md
          gh issue close "${{ github.event.issue.number }}" --repo "$REPO" \
            --reason completed