name: Dispatch Hermes Bot

# Dispatch a job to a Hermes Bot profile AND record the exchange:
#   - reply + model/provider + tokens -> logs/dispatches/<UTC-day>/run-<id>.md
#   - token usage ledger             -> data/usage/usage.jsonl
# Dispatches persist as per-bot chat sessions (X-Hermes-Session-Id: fleet-<bot>)
# so every exchange is readable in the Desktop Bots tab with GitHub checkpoint
# links embedded in each turn.

on:
  repository_dispatch:
    types: [hermes-bot-run]
  workflow_dispatch:
    inputs:
      bot:        { description: "Bot/profile name", required: true, default: "default" }
      machine:    { description: "Target fleet: tasker-p1 (default) or designlab1 (relayed via peer)", required: false, default: "tasker-p1" }
      task:       { description: "Task prompt for the bot", required: true }
      deliver_to: { description: "Delivery target (bot-chat|all|platform:chat:id)", required: false, default: "" }

env:
  HERMES_URL: ${{ secrets.HERMES_API_URL }}
  HERMES_KEY: ${{ secrets.HERMES_API_KEY }}
  SCOUT_KEY: ${{ secrets.SCOUT_API_KEY }}
  SCRIBE_KEY: ${{ secrets.SCRIBE_API_KEY }}
  BOT_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
  REPO: Rojman1984/hermes-github-bots

jobs:
  dispatch:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Dispatch to Hermes
        run: |
          set -euo pipefail
          if [ -z "${HERMES_URL}" ] || [ -z "${HERMES_KEY}" ]; then
            echo "::error::Set HERMES_API_URL and HERMES_API_KEY repo secrets first."
            exit 1
          fi

          BOT="${{ github.event.inputs.bot || github.event.client_payload.bot || 'default' }}"
          MACHINE="${{ github.event.inputs.machine || github.event.client_payload.machine || 'tasker-p1' }}"
          TASK="${{ github.event.inputs.task || github.event.client_payload.task || '' }}"
          DELIVER="${{ github.event.inputs.deliver_to || github.event.client_payload.deliver_to || '' }}"

          [ -n "$TASK" ] || { echo "::error::No task provided."; exit 1; }

          if [ "$MACHINE" = "designlab1" ]; then
            RELAY_PREFIX="[PEER-RELAY to designlab1] Deliver this task by running EXACTLY this shell command from inside your gateway host: hermes peer dm designlab1 < /dev/stdin - with the task text below on stdin. IMPORTANT: do NOT parse or answer the task yourself; the reply from the peer is the deliverable. After sending, report: (1) the literal line RELAY_STATUS=OK or RELAY_STATUS=FAILED, then (2) the peer reply verbatim. Task:"
            TASK="${RELAY_PREFIX} ${TASK}"
          fi

          # model-tier routing: named worker bots run LOCAL models via their own
          # multiplexed profile endpoints; default/orchestrator stays on cloud.
          case "$BOT" in
            scout)   ROUTE="/p/scout";  BOTKEY="$SCOUT_KEY"  ;;
            scribe)  ROUTE="/p/scribe"; BOTKEY="$SCRIBE_KEY" ;;
            *)       ROUTE="";          BOTKEY="$HERMES_KEY" ;;
          esac
          [ -n "$BOTKEY" ] || { echo "::error::No API key for bot '$BOT'"; exit 1; }
          echo "routing bot '$BOT' -> ${ROUTE:-/} (local-tier: $([ -n "$ROUTE" ] && echo yes || echo no))"

          jq -n \
            --arg bot "$BOT" \
            --arg task "$TASK" \
            --arg deliver "$DELIVER" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg log_url "${{ github.server_url }}/${{ github.repository }}/blob/main/logs/dispatches/$(date -u +%F)/run-${{ github.run_id }}.md" \
            '{model: ("hermes-" + $bot),
              messages: [{role: "user", content: ($task + "\n\n[GITHUB-CHECKPOINTS] run: " + $run_url + " | log (appears ~1 min after completion): " + $log_url)}],
              hermes_deliver: (if $deliver == "" then null else $deliver end),
              hermes_run_url: $run_url}' > payload.json

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST \
            "${HERMES_URL%/}${ROUTE}/v1/chat/completions" \
            -H "Authorization: Bearer ${BOTKEY}" \
            -H "X-Hermes-Session-Id: fleet-${BOT}" \
            -H "Content-Type: application/json" \
            --max-time 540 \
            -d @payload.json)

          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Hermes returned HTTP ${HTTP_CODE}"
            cat /tmp/resp.txt || true
            exit 1
          fi

          jq -r '.choices[0].message.content' /tmp/resp.txt > /tmp/reply.md
          echo "--- bot reply (first 500 chars) ---"
          head -c 500 /tmp/reply.md

          mkdir -p /tmp/fleetlog
          cp /tmp/reply.md /tmp/fleetlog/reply.md
          jq -c '{model, usage}' /tmp/resp.txt > /tmp/fleetlog/api_meta.json
          printf '{"bot":"%s","machine":"%s","task":%s}\n' \
            "$BOT" "$MACHINE" "$(jq -Rsa . <<<"$TASK")" > /tmp/fleetlog/meta.json

      - name: Record reply + usage to the repo
        if: success()
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q /tmp/fleetrepo
          cd /tmp/fleetrepo
          git config user.name  "hermes-bot[bot]"
          git config user.email "hermes-bot@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git remote add origin "https://x-access-token:${BOT_TOKEN}@github.com/${REPO}.git" 2>/dev/null || true
            git fetch -q origin main 2>/dev/null || { echo "::error::fetch failed"; exit 1; }
            git checkout -q -b work origin/main

            DAY=$(date -u +%F); NOW=$(date -u +%FT%TZ)
            RUN="${{ github.run_id }}"
            BOT=$(jq -r '.bot // ""' /tmp/fleetlog/meta.json)
            MACHINE=$(jq -r '.machine // ""' /tmp/fleetlog/meta.json)
            TASK=$(jq -r '.task // ""' /tmp/fleetlog/meta.json)
            PT=$(jq -r '.usage.prompt_tokens // 0' /tmp/fleetlog/api_meta.json)
            CT=$(jq -r '.usage.completion_tokens // 0' /tmp/fleetlog/api_meta.json)
            TT=$(jq -r '.usage.total_tokens // 0' /tmp/fleetlog/api_meta.json)
            # provider/model ground truth: session id is ours by construction
            SID="fleet-${BOT}${ROUTE:+-local}"
            # re-derive routing in this step (ROUTE/BOTKEY live in step 1's shell)
            case "$BOT" in
              scout)  ROUTE="/p/scout";  BOTKEY="$SCOUT_KEY"  ;;
              scribe) ROUTE="/p/scribe"; BOTKEY="$SCRIBE_KEY" ;;
              *)      ROUTE="";          BOTKEY="$HERMES_KEY" ;;
            esac
            case "$BOT" in
              scout)  SPROVIDER="ollama-local"; SBASEURL="http://172.24.0.1:11434/v1 (tasker-p1 iGPU)" ;;
              scribe) SPROVIDER="ollama-local"; SBASEURL="http://172.24.0.1:11434/v1 (tasker-p1 iGPU)" ;;
              *)      SPROVIDER="custom";       SBASEURL="https://ollama.com/v1" ;;
            esac
            SESSION_JSON=$(curl -s -m 20 "${HERMES_URL%/}${ROUTE}/api/sessions/$SID" \
              -H "Authorization: Bearer ${BOTKEY:-${HERMES_KEY}}" || echo '{}')
            SMODEL=$(echo "$SESSION_JSON" | jq -r '.session.model // "unknown"')

            F="logs/dispatches/$DAY/run-$RUN.md"
            mkdir -p "$(dirname "$F")"
            {
              echo "# Dispatch run $RUN - bot \`$BOT\`"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| When | $NOW |"
              echo "| Machine | $MACHINE |"
              echo "| Model | $SMODEL |"
              echo "| Provider | $SPROVIDER ($SBASEURL) |"
              echo "| Tokens | prompt=$PT completion=$CT total=$TT |"
              echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN |"
              echo ""
              echo "## Task"
              echo ""
              echo "$TASK"
              echo ""
              echo "## Reply"
              echo ""
              cat /tmp/fleetlog/reply.md
            } > "$F"

            mkdir -p data/usage
            jq -cn --arg ts "$NOW" --arg run "$RUN" --arg bot "$BOT" --arg machine "$MACHINE" \
              --arg model "$SMODEL" --arg provider "$SPROVIDER" --arg base_url "$SBASEURL" \
              --arg sid "$SID" \
              --argjson pt "$PT" --argjson ct "$CT" --argjson tt "$TT" \
              '{ts: $ts, run_id: $run, bot: $bot, machine: $machine,
                model: $model, provider: $provider, base_url: $base_url,
                session_id: $sid,
                prompt_tokens: $pt, completion_tokens: $ct, total_tokens: $tt}' \
              >> data/usage/usage.jsonl

            git add logs/dispatches data/usage
            git commit -m "bot(dispatch): log run $RUN ($BOT, ${TT} tokens)" >/dev/null
            if git push -q origin HEAD:main 2>/dev/null; then
              echo "Recorded: $F (+usage ledger)"
              break
            fi
            [ "$ATTEMPT" = "3" ] && { echo "::error::Could not push dispatch log after 3 attempts"; exit 1; }
            echo "push race (attempt $ATTEMPT) - retrying"
            sleep 3
          done
